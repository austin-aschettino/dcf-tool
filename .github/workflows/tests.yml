name: Tests

# Runs the automated tests on every push and pull request, so a mistake shows up
# as a red ❌ on GitHub before it reaches the live app.
on:
  push:
  pull_request:

jobs:
  test:
    # Ubuntu 24.04 still offers Python 3.9 (the version this project runs on locally); newer images don't.
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt
      - name: Install dependencies
        run: pip install -r requirements-dev.txt
      - name: Run tests
        run: python -m pytest -q
