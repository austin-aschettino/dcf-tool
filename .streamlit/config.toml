[client]
toolbarMode = "minimal"

[server]
headless = true

[browser]
gatherUsageStats = false

# ---- Look and feel: the Columnar Pad --------------------------------------------------
# Pale green pad stock with a ledger-green sidebar; Public Sans for words (figures are set in
# Source Serif 4 by the app's stylesheet); blue is reserved for the visitor's own assumptions.
[theme]
base = "light"
primaryColor = "#1e4636"
backgroundColor = "#eef3ec"
secondaryBackgroundColor = "#e2ebe3"
textColor = "#16201b"
borderColor = "#c9d8cd"
linkColor = "#2747b8"
font = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFont = "Public Sans:https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap, sans-serif"
headingFontWeights = [700, 700, 700, 700, 600, 600]
baseRadius = "0.5rem"
buttonRadius = "0.375rem"
showWidgetBorder = true
blueColor = "#2747b8"
greenColor = "#1f6b43"
redColor = "#b4261d"
orangeColor = "#8a5a00"
violetColor = "#5b4a8a"
chartCategoricalColors = ["#1e4636", "#4f8a6c", "#a8761b", "#5b4a8a", "#2f7f8f", "#8a978f", "#c9b27a"]

[theme.sidebar]
backgroundColor = "#1e4636"
secondaryBackgroundColor = "#173a2c"
textColor = "#e3ede6"
primaryColor = "#b8c6ff"
borderColor = "#3a6b56"
